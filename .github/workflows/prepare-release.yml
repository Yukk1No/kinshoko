name: prepare-release

# 发布第一步：在 Actions 页面选分支、填版本号，在新分支 release/v<版本号> 上改好 Cargo.toml、Cargo.lock、
# package.json、package-lock.json 的版本号，再在运行摘要里给出开 PR 的链接。
# PR 合并后，tag-release 工作流打 v<版本号> 标签并启动 release。
#
# 版本号与分支的规则在 scripts/release/release-version.mjs：测试版 1.0.0-beta.1、候选版 1.0.0-rc.1
# 选 integration/v1，正式版 1.0.0 选 main。
#
# 仓库设置不允许 Actions 开 PR，所以只推分支，PR 由维护者点链接打开。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 1.0.0-beta.1（不带 v）。测试版、候选版选 integration/v1，正式版选 main"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  bump:
    name: 在新分支上改版本号
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 检查版本号与分支
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::请在分支上运行，不要选标签。"; exit 1
          fi
          current=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if ! problem=$(node scripts/release/release-version.mjs "$VERSION" "$GITHUB_REF_NAME" "$current" 2>&1); then
            echo "::error::$problem"; exit 1
          fi
          for ref in "refs/tags/v$VERSION" "refs/heads/release/v$VERSION"; do
            if git ls-remote --exit-code origin "$ref" >/dev/null; then
              echo "::error::$ref 已经存在。"; exit 1
            fi
          done
          echo "从 $current 改到 $VERSION，目标分支 $GITHUB_REF_NAME"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - name: 改版本号
        run: |
          set -euo pipefail
          sed -i '/^\[workspace.package\]/,/^\[/s/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml
          # 只更新工作区成员在 Cargo.lock 里的版本，不动依赖。
          cargo update --workspace
          npm version "$VERSION" --no-git-tag-version
          test "$(cargo pkgid -p kinshoko | sed 's/.*@//')" = "$VERSION"
          git diff --stat

      - name: 推送 release 分支
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release/v$VERSION"
          git commit -am "chore(release): v$VERSION"
          git push origin "release/v$VERSION"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$GITHUB_REF_NAME...release/v$VERSION?expand=1"
          {
            echo "### 下一步：开 PR 并合并"
            echo
            echo "[把 release/v$VERSION 合并到 $GITHUB_REF_NAME]($url)"
            echo
            echo "合并后 tag-release 会打 v$VERSION 标签并启动 release。"
          } >> "$GITHUB_STEP_SUMMARY"
