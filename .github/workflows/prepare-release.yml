name: prepare-release

# 发布第一步：从 main 新建分支 release/v<版本号>（例如在 GitHub 的分支菜单里输入 release/v1.1.0-beta.1，
# 选“从 main 创建”；维护分支上的补丁版本从 maint/<主>.<次> 创建）。这个工作流在该分支上改好 Cargo.toml、
# Cargo.lock、package.json、package-lock.json 的版本号并提交，运行摘要给出开 PR 的链接。PR 合并后由
# tag-release 接手。仓库设置不允许 Actions 开 PR，所以 PR 由维护者点链接打开。
#
# 版本号规则在 scripts/release/release-version.mjs：main 上发任何版本，maint/<主>.<次> 只发同一主次版本号。

on:
  push:
    branches: ["release/v*"]

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    name: 在 release 分支上改版本号
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 检查版本号与分支
        id: check
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#release/v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          current=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          # 已经改好（例如之后又往这个分支推了提交）时不再改。
          if [ "$current" = "$version" ]; then
            echo "::notice::版本号已经是 $version。"; echo "bump=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 从维护分支新建的发布到维护分支，否则发布到 main。先认维护分支：它刚从标签建出、还没有修复时也是 main 的祖先。
          base=main
          maint="maint/$(echo "$version" | cut -d. -f1,2)"
          if git rev-parse -q --verify "origin/$maint" >/dev/null && git merge-base --is-ancestor HEAD "origin/$maint"; then
            base=$maint
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if ! git merge-base --is-ancestor HEAD "origin/$base"; then
            echo "::error::$GITHUB_REF_NAME 要从 main（补丁版本可从 $maint）新建，不带别的提交。"; exit 1
          fi
          if ! problem=$(node scripts/release/release-version.mjs prepare "$version" "$base" "$current" 2>&1); then
            echo "::error::$problem 分支名应为 release/v<版本号>，例如 release/v1.0.0-beta.1。"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::标签 v$version 已经存在。"; exit 1
          fi
          echo "从 $current 改到 $version"
          echo "bump=true" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        if: steps.check.outputs.bump == 'true'
        with:
          toolchain: "1.95"

      - name: 改版本号并提交
        if: steps.check.outputs.bump == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          BASE: ${{ steps.check.outputs.base }}
        run: |
          set -euo pipefail
          sed -i '/^\[workspace.package\]/,/^\[/s/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml
          # 只更新工作区成员在 Cargo.lock 里的版本，不动依赖。
          cargo update --workspace
          # 探测程序以路径依赖引用核心 crate，它的 Cargo.lock 里也记着核心 crate 的版本。
          cargo update -p kinshoko-core --manifest-path tools/downscale-probe/Cargo.toml
          npm version "$VERSION" --no-git-tag-version
          test "$(cargo pkgid -p kinshoko | sed 's/.*@//')" = "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$BASE...$GITHUB_REF_NAME?expand=1"
          {
            echo "### 下一步：开 PR 并合并"
            echo
            echo "[把 $GITHUB_REF_NAME 合并到 $BASE]($url)"
            echo
            echo "合并后 tag-release 会打 v$VERSION 标签并构建草稿 Release。"
          } >> "$GITHUB_STEP_SUMMARY"
