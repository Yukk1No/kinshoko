name: close-issues

# PR 合进 integration/** 后关闭正文里 Closes/Fixes/Resolves #N 指向的 issue。
# GitHub 只在 PR 合进默认分支（main）时自动关 issue，v1 发布前主干是 integration/v1，所以由这里补上。
# 规则与 GitHub 一致：关键字后紧跟 #N 才算，一个关键字只认一个编号；“Partially fixes #N”与“Refs #N”不关。
# 只读 PR 正文，不读标题和提交信息。

on:
  pull_request:
    types: [closed]
    branches: ["integration/**"]

permissions:
  contents: read

jobs:
  close:
    name: 关闭已修复的 issue
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 关闭 issue
        env:
          # grep -P 要求 UTF-8 区域设置，正文里有中文。
          LC_ALL: C.UTF-8
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          numbers=$(printf '%s\n' "$BODY" \
            | grep -oiP '(?<!partially )(?<![\w-])(close[sd]?|fix(e[sd])?|resolve[sd]?):?\s+#\K[0-9]+' \
            | sort -un || true)
          if [ -z "$numbers" ]; then
            echo "PR #$PR 正文里没有 Closes/Fixes/Resolves #N。"
            exit 0
          fi
          for n in $numbers; do
            if ! state=$(gh issue view "$n" --json state -q .state 2>/dev/null); then
              echo "::warning::#$n 不是本仓库的 issue（可能是 PR），跳过。"
              continue
            fi
            if [ "$state" != OPEN ]; then
              echo "#$n 已经是 $state，跳过。"
              continue
            fi
            gh issue close "$n" --comment "已由 #$PR 修复，合入 \`$BASE\`。"
            echo "已关闭 #$n。"
          done
