name: tag-release

# 发布第二步：prepare-release 开出的版本号 PR 合并到 integration/v1 或 main 后，
# 打 v<版本号> 标签并在标签上启动 release（构建、安装检查、草稿 Release）。
#
# 只在这次推送改了 [workspace.package] version、版本号与分支符合 scripts/release/release-version.mjs 的规则、
# 标签还不存在时才打标签；其余情况（例如 integration/v1 合进 main 时带来测试版版本号）只记一条说明。
# Actions 令牌推送的标签不会触发 push 事件，所以这里直接启动 release。

on:
  push:
    branches: [main, "integration/**"]
    paths: ["Cargo.toml"]

permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: 打标签并启动发布
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 判断是否要发布
        id: check
        run: |
          set -euo pipefail
          read_version() { sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p'; }
          version=$(read_version < Cargo.toml)
          before=$(git show HEAD^:Cargo.toml 2>/dev/null | read_version || true)
          skip() { echo "::notice::$1"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$version" != "$before" ] || skip "版本号没有变（$version），不发布。"
          if ! problem=$(node scripts/release/release-version.mjs "$version" "$GITHUB_REF_NAME" 2>&1); then
            skip "$problem 不发布。"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            skip "标签 v$version 已经存在，不发布。"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: 打标签
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Kinshoko $VERSION"
          git push origin "v$VERSION"

      - name: 启动 release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          gh workflow run release.yml --ref "v$VERSION"
          echo "已在 v$VERSION 上启动 release，完成后到 Releases 页面检查草稿再发布。" >> "$GITHUB_STEP_SUMMARY"
