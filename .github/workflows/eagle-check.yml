name: eagle-check

on:
  push:
    paths:
      - "prototype/storage-roundtrip/**"
      - ".github/workflows/eagle-check.yml"
  pull_request:
    paths:
      - "prototype/storage-roundtrip/**"
      - ".github/workflows/eagle-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: prototype/storage-roundtrip
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller==6.*
      - name: Constructed-sample round trip (run.py)
        run: python run.py
      - name: Build exe
        run: python -m PyInstaller --onefile --console --name kinshoko-eagle-check --distpath dist eagle_check.py
      - name: Self-test exe against a fixture library
        shell: pwsh
        run: |
          python make_eagle_fixture.py "$env:RUNNER_TEMP/fx" --n 150
          $env:APPDATA = "$env:RUNNER_TEMP/fx/appdata"
          ./dist/kinshoko-eagle-check.exe --yes --no-open --work "$env:RUNNER_TEMP/w"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP/w/报告/report.md"; exit 1 }
          Remove-Item dist/kinshoko-eagle-check-报告-*.zip
      - name: Package
        shell: pwsh
        run: |
          $out = "dist/kinshoko-eagle-check"
          New-Item -ItemType Directory -Force $out | Out-Null
          Move-Item dist/kinshoko-eagle-check.exe $out/
          Copy-Item 使用说明.md $out/
      - uses: actions/upload-artifact@v4
        with:
          name: kinshoko-eagle-check-${{ github.sha }}
          path: prototype/storage-roundtrip/dist/kinshoko-eagle-check
          retention-days: 30
