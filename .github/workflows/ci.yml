name: ci

on:
  push:
    branches: [main, "integration/**"]
    paths-ignore:
      - "docs/**"
      - "design/**"
      - "tools/**"
      - "prototype/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "design/**"
      - "tools/**"
      - "prototype/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: Windows 应用
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 工具链版本以 rust-toolchain.toml 为准，这里只保证组件齐全。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Rust 格式检查
        run: cargo fmt --all --check

      # 应用壳编译时要读到前端产物（tauri.conf.json 的 frontendDist），先构建前端。
      - name: 前端构建
        run: npm run vite:build

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 核心 crate 测试（同时重新生成 ts-rs 类型）
        run: npm run bindings -- --locked

      - name: ts-rs 生成物与提交内容一致
        shell: pwsh
        run: |
          $changes = git status --porcelain -- src/bindings
          if ($changes) {
            git status -- src/bindings
            git diff -- src/bindings
            Write-Error "src/bindings 与 Rust 类型不一致：运行 npm run bindings 后提交生成物。"
            exit 1
          }

      - name: TS 类型检查
        run: npm run typecheck

      - name: 前端测试
        run: npm test

      - name: Tauri 原生构建与安装包
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: kinshoko-setup-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          retention-days: 14
