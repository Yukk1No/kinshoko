<!doctype html><meta charset="utf-8"><title>gpu-probe</title>
<!--
  #212：显卡档打标对前台 GPU 渲染（例如游戏）的影响。全屏片元着色器反复画同一帧，n 控制每帧的 GPU 计算量；
  调到 GPU 吃满、帧率在 60–100 fps 之间（RTX 4070 SUPER、1579×910 窗口约 n=7000）。
  window.frames 记下每帧的时刻（epoch 毫秒），window.stats(从, 到) 给出这段时间的帧率与帧间隔分位数。
  用法：npx vite --port 5216；用独立浏览器窗口打开 http://localhost:5216/scripts/perf/gpu-frame-probe.html?n=7000
  （窗口要在屏幕上可见，隐藏的页面不渲染），记下时刻后运行 load_probe --device directml，再分别取打标前后两段的 stats。
-->
<style>html,body{margin:0;height:100%;background:#000}canvas{width:100vw;height:100vh;display:block}</style>
<canvas id="c"></canvas>
<script>
const N = Number(new URLSearchParams(location.search).get("n") ?? 300);
const c = document.getElementById("c");
c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
const gl = c.getContext("webgl2");
const vs = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0,1); }`;
const fs = `#version 300 es
precision highp float; out vec4 o; uniform float t;
void main(){ vec2 uv = gl_FragCoord.xy / 512.0; float a = 0.0;
  for (int i = 0; i < ${N}; i++) { a += sin(uv.x * float(i) + t) * cos(uv.y * float(i) - t); }
  o = vec4(fract(a), fract(a*0.5), fract(a*0.25), 1); }`;
const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const ut = gl.getUniformLocation(pr, "t");
window.frames = [];
const loop = (now) => { gl.uniform1f(ut, now / 1000); gl.drawArrays(gl.TRIANGLES, 0, 3); window.frames.push(performance.timeOrigin + now); requestAnimationFrame(loop); };
requestAnimationFrame(loop);
window.stats = (from, to) => { const f = window.frames.filter((x) => x >= from && x <= to); const d = f.slice(1).map((x, i) => x - f[i]).sort((a, b) => a - b);
  const q = (p) => +d[Math.min(d.length - 1, Math.floor(d.length * p))].toFixed(1);
  return { frames: d.length, fps: +(d.length / ((f.at(-1) - f[0]) / 1000)).toFixed(1), p50: q(0.5), p95: q(0.95), p99: q(0.99), max: +d.at(-1).toFixed(1), over50ms: d.filter((x) => x > 50).length }; };
</script>
