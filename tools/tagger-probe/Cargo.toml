[package]
name = "kinshoko-tagger-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "Measures the PixAI and WD taggers on CPU and DirectML on a target Windows machine."

[dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "directml", "download-binaries", "copy-dylibs", "tls-rustls"] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = "thin"
