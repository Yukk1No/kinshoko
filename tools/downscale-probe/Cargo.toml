[package]
name = "kinshoko-downscale-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "让画师在自己的屏幕上并排比较线性光与编码值空间两种缩小算法（#48）。"

[dependencies]
# 两种缩略图都由应用的还原度管线生成，与资料库里的缩略图是同一份代码。
kinshoko-core = { path = "../../crates/kinshoko-core" }
# 与应用相同的 WebView2 窗口（Tauri 2 用的 tao、wry 版本）。
tao = "0.37"
wry = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"

# 解码、色彩管理与缩放在未优化构建里慢一两个数量级。
[profile.dev.package]
image = { opt-level = 3 }
moxcms = { opt-level = 3 }
fast_image_resize = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
png = { opt-level = 3 }
image-webp = { opt-level = 3 }
fdeflate = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
kinshoko-core = { opt-level = 3 }
kinshoko-downscale-probe = { opt-level = 3 }
