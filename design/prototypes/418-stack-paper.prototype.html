<meta charset="utf-8">
<title>一摞的纸张对比</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<style>
/* 布局：顶栏一行控制，下面三栏，每栏是同一面两列小墙，只换一摞的摆法。颜色取应用 v3 token。 */
:root {
  --bg: #f7f3ea;
  --surface: #fffdf8;
  --ink: #2b2747;
  --ink-2: #5b5773;
  --ink-3: #76718c;
  --line: #e3daca;
  --line-2: #d4c9b5;
  --accent: #e0768f;
  --accent-strong: #a63a55;
  --accent-soft: rgba(224, 118, 143, 0.14);
  --wall: #eae9e6;
  --sheet-edge: rgba(43, 39, 71, 0.2);
  --sheet-drop: rgba(43, 39, 71, 0.14);
  --sheet-light: rgba(255, 255, 255, 0.22);
  --contact: 43, 39, 71;
  --pill: rgba(0, 0, 0, 0.62);
  --spring: cubic-bezier(0.2, 0.9, 0.25, 1.05);
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --t: 200ms;
  --t-slow: 260ms;
  --font: Inter, "Noto Sans SC", "Microsoft YaHei UI", "PingFang SC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1e1c2c; --surface: #252336; --ink: #f4ecdc; --ink-2: #c8c0b2; --ink-3: #9890a8;
    --line: #353249; --line-2: #45415c; --accent: #e3b34f; --accent-strong: #e9c26e;
    --accent-soft: rgba(227, 179, 79, 0.16); --wall: #161618;
    --sheet-edge: rgba(0, 0, 0, 0.55); --sheet-drop: rgba(0, 0, 0, 0.4); --sheet-light: rgba(255, 255, 255, 0.1);
    --contact: 0, 0, 0; --pill: rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1e1c2c; --surface: #252336; --ink: #f4ecdc; --ink-2: #c8c0b2; --ink-3: #9890a8;
  --line: #353249; --line-2: #45415c; --accent: #e3b34f; --accent-strong: #e9c26e;
  --accent-soft: rgba(227, 179, 79, 0.16); --wall: #161618;
  --sheet-edge: rgba(0, 0, 0, 0.55); --sheet-drop: rgba(0, 0, 0, 0.4); --sheet-light: rgba(255, 255, 255, 0.1);
  --contact: 0, 0, 0; --pill: rgba(0, 0, 0, 0.7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 13px/1.6 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
::selection { background: var(--accent-soft); color: var(--ink); }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin: 0 auto 16px; max-width: 1160px; }
h1 { font-size: 16px; font-weight: 600; margin: 0; text-wrap: balance; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
button.ctl {
  height: 32px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line-2);
  background: var(--surface); color: var(--ink); font: 500 13px/1 var(--font); cursor: pointer;
}
button.ctl[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
button.ctl:focus-visible, .count:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.batch { color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; align-self: center; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; max-width: 1160px; margin: 0 auto; }
.col { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.col h2 { font-size: 13px; font-weight: 600; margin: 0; }
.col p { margin: 0; color: var(--ink-2); font-size: 12px; min-height: 4.8em; }
.wall { position: relative; background: var(--wall); border-radius: 12px; overflow: hidden; }
.cell { position: absolute; }
.single { border-radius: 2px; background-size: cover; background-position: center; }
.stack { touch-action: manipulation; }
.layer, .cover, .contact { position: absolute; pointer-events: none; }
.layer {
  background-size: cover; background-position: center;
  box-shadow: 0 0 0 0.5px var(--sheet-edge), 0 1px 1.5px var(--sheet-drop), inset 0 1px 0 var(--sheet-light);
  transition: transform var(--t-slow) var(--spring);
}
.cover {
  background-size: cover; background-position: center;
  box-shadow: 0 0 0 0.5px var(--sheet-edge), 0 1px 2px var(--sheet-drop), 0 var(--lift, 3px) var(--spread, 6px) -2px var(--sheet-drop), inset 0 1px 0 var(--sheet-light);
  transition: transform var(--t-slow) var(--spring), box-shadow var(--t) var(--ease);
}
.stack.hot .cover {
  box-shadow: 0 0 0 0.5px var(--sheet-edge), 0 3px 6px var(--sheet-drop), 0 16px 30px -6px rgba(var(--contact), 0.4), inset 0 1px 0 var(--sheet-light);
}
.contact {
  height: 14px; border-radius: 50%;
  transition: transform var(--t-slow) var(--spring), filter var(--t) var(--ease), opacity var(--t) var(--ease);
}
.stack.hot .contact { transform: translateY(5px) scaleX(1.06); opacity: 0.7; }
.count {
  position: absolute; top: 6px; left: 6px; display: inline-flex; align-items: center; gap: 4px; height: 22px;
  padding: 0 8px 0 6px; border: 0; border-radius: 999px; background: var(--pill); color: #fff;
  font: 600 11px/1 var(--font); font-variant-numeric: tabular-nums; cursor: pointer; pointer-events: auto;
}
.angles {
  position: absolute; left: 0; right: 0; bottom: -1px; text-align: center; font-size: 11px; line-height: 1;
  color: var(--ink-2); font-variant-numeric: tabular-nums; pointer-events: none;
}
.angles[hidden] { display: none; }
.foot { max-width: 1160px; margin: 20px auto 0; color: var(--ink-2); font-size: 12px; }
.foot ul { margin: 4px 0 0; padding-left: 18px; }
@media (prefers-reduced-motion: reduce) {
  .layer, .cover, .contact { transition: none; }
}
</style>

<div class="top">
  <h1>一摞的纸张：三种摆法</h1>
  <div class="controls">
    <span class="batch" id="batch">第 1 批</span>
    <button class="ctl" id="reroll" type="button">换一批</button>
    <button class="ctl" id="lift" type="button" aria-pressed="false">全部拿起</button>
    <button class="ctl" id="angles" type="button" aria-pressed="false">显示角度</button>
  </div>
</div>

<div class="cols" id="cols"></div>

<div class="foot">
  三栏用同一面墙、同一批图，只换下面几层纸的摆法。悬停停 120 毫秒才拿起。「换一批」换的是图集键，等于换一批作品。
  <ul>
    <li>后两栏的共同改法：封面摆正；纸边露出按像素算（静止约 3–7 像素），横图和长图露得一样多；下面几层与封面同宽，高度按各页比例；不调暗、不降饱和。</li>
    <li>图是假数据，用渐变代替。</li>
  </ul>
</div>

<script>
(() => {
  const INS = 10, CELL = 160, GAP = 10, PAD = 10, LANES = 2;
  const FW = CELL - INS * 2;

  const VARIANTS = [
    { id: "current", name: "现版（第 5 版原型）", note: "层与层左右交替；角度按封面高度换算，所以横图歪得多、长图几乎不歪；封面也斜；下面几层调暗。" },
    { id: "lean", name: "统一朝向", note: "整摞朝一边歪，越往下歪得越多；大约三分之一的摞里有一层反过来。" },
    { id: "random", name: "随机朝向", note: "每一层各自随机朝左或朝右，幅度也各自随机。" }
  ];

  // 图集：ratio 是高 / 宽，vary 是各页比例的偏差。
  const SETS = [
    { n: 2, ratio: 1.0, vary: [0, 0], hue: 140 },
    { n: 3, ratio: 0.72, vary: [0, 0.12, 0], hue: 275 },
    { n: 6, ratio: 1.414, vary: [0, 0.14, -0.12, 0, 0.1, 0], hue: 205 },
    { n: 12, ratio: 1.42, vary: [0, 0, 0.18, 0.12, 0, 0, -0.2, 0, 0, 0, 0.24, 0], hue: 22 },
    { n: 4, ratio: 1.6, vary: [0, -0.16, 0.12, 0], hue: 340 },
    { n: 5, ratio: 0.56, vary: [0, 0.1, 0, -0.06, 0], hue: 50 }
  ];
  const ORDER = "s A s B C s D s E F s s".split(" ");
  const RATIOS = [0.66, 0.75, 1, 1.25, 1.33, 1.414, 1.5, 0.56];

  const rnd = (n) => {
    let t = (n * 2654435761) >>> 0;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const art = (h, l, p) =>
    "radial-gradient(ellipse 30% 22% at " + (40 + (p * 7) % 20) + "% 38%, hsl(" + (h + 30) + " 45% " + Math.min(l + 28, 90) + "% / .9), transparent 70%)," +
    "radial-gradient(ellipse 46% 40% at " + (44 + (p * 5) % 16) + "% 92%, hsl(" + (h - 20) + " 35% " + (l - 18) + "% / .85), transparent 72%)," +
    "linear-gradient(165deg, hsl(" + h + " 46% " + (l + 10) + "%), hsl(" + (h + 26) + " 38% " + (l - 12) + "%))";
  const deg = (rad) => rad * 180 / Math.PI;

  let salt = 0, lifted = false, showAngles = false;

  function items() {
    const out = [];
    let si = 0, ki = 0;
    for (const tok of ORDER) {
      if (tok === "s") {
        si++;
        const r = rnd(salt * 1000 + si * 17);
        out.push({ kind: "single", ratio: RATIOS[Math.floor(r * RATIOS.length)], bg: art(Math.round(rnd(salt * 1000 + si * 29) * 360), 52 + r * 14, si) });
      } else {
        const s = SETS[ki++];
        const seed = 1 + Math.floor(rnd(salt * 7919 + ki * 104729) * 997);
        const pages = [];
        for (let p = 0; p < s.n; p++) {
          pages.push({ ratio: s.ratio * (1 + (s.vary[p] || 0)), bg: art(s.hue + (p % 3) * 9 - 9, 46 + ((p * 7) % 5) * 4, p) });
        }
        out.push({ kind: "stack", pages, seed });
      }
    }
    return out;
  }

  // 第 5 版原型的算法，原样搬过来。
  function current(pages, seed) {
    const ch = Math.round(FW * Math.min(pages[0].ratio, 2.2)), half = ch / 2;
    const rRest = deg(Math.atan((INS - 2) / half)), rHot = deg(Math.atan((INS + 12) / half));
    const depth = Math.min(pages.length - 1, 3);
    const layers = [];
    for (let k = depth; k >= 1; k--) {
      const pg = pages[Math.min(k, pages.length - 1)];
      const a = rnd(seed * 31 + k), b = rnd(seed * 57 + k * 7), c = rnd(seed * 13 + k * 3);
      const sign = (seed + k) % 2 ? 1 : -1;
      const reach = 0.55 + 0.45 * (k / depth);
      const w = Math.round(FW * (0.92 + 0.08 * b));
      let h = Math.round(w * Math.min(pg.ratio, 2.2));
      h = Math.max(Math.round(ch * 0.84), Math.min(h, ch + INS - 3));
      layers.push({
        k, bg: pg.bg, w, h,
        left: INS + (FW - w) / 2 + (b - 0.5) * 6, top: INS + (c - 0.5) * 6, origin: "50% 60%",
        rest: { x: 0, y: 0, r: sign * (0.5 + 0.5 * a) * rRest * reach },
        hot: { x: sign * (2 + k * 1.5), y: -2 - k * 1.5, r: sign * (0.6 + 0.4 * a) * rHot * reach },
        filter: "saturate(0.82) brightness(" + (0.95 - k * 0.025).toFixed(3) + ")"
      });
    }
    const coverRest = depth ? (rnd(seed * 91) - 0.5) * Math.min(1.4, rRest * 0.5) : 0;
    return { ch, depth, layers, coverRest };
  }

  // 后两栏共用：同宽、各页比例、纸边按像素、封面摆正、不调色。只有每层的朝向不同。
  function revised(pages, seed, signOf) {
    const ch = Math.round(FW * Math.min(pages[0].ratio, 2.2));
    const depth = Math.min(pages.length - 1, 3);
    const layers = [];
    for (let k = depth; k >= 1; k--) {
      const pg = pages[k];
      const a = rnd(seed * 31 + k);
      const w = FW;
      const h = Math.max(Math.round(ch * 0.84), Math.min(Math.round(w * Math.min(pg.ratio, 2.2)), ch + INS - 3));
      const halfDiag = Math.sqrt(w * w + h * h) / 2;
      const { sign, amount } = signOf(k, depth, a);
      const edgeRest = (2.4 + 1.4 * k) * amount;
      const edgeHot = (5 + 3 * k) * amount;
      layers.push({
        k, bg: pg.bg, w, h, left: INS, top: INS, origin: "50% 50%",
        rest: { x: sign * 0.4 * k, y: 0.5 * k, r: sign * deg(edgeRest / halfDiag) },
        hot: { x: sign * (1 + 1.2 * k), y: -1 - 0.8 * k, r: sign * deg(edgeHot / halfDiag) },
        filter: "none"
      });
    }
    return { ch, depth, layers, coverRest: 0 };
  }
  const lean = (pages, seed) => {
    const dir = rnd(seed * 7) < 0.5 ? -1 : 1;
    const flips = rnd(seed * 11) < 0.35;
    return revised(pages, seed, (k, depth, a) => {
      const flipped = flips && depth >= 2 && k === 1 + Math.floor(rnd(seed * 19) * depth);
      return { sign: flipped ? -dir : dir, amount: (flipped ? 0.6 : 0.85) + 0.3 * a };
    });
  };
  const random = (pages, seed) =>
    revised(pages, seed, (k, depth, a) => ({ sign: rnd(seed * 41 + k * 13) < 0.5 ? -1 : 1, amount: 0.6 + 0.6 * a }));

  const LAYOUT = { current, lean, random };
  const tf = (t) => "translate(" + t.x.toFixed(1) + "px," + t.y.toFixed(1) + "px) rotate(" + t.r.toFixed(2) + "deg)";
  const signed = (r) => (r > 0 ? "+" : r < 0 ? "−" : "") + Math.abs(r).toFixed(1) + "°";

  function stackEl(item, variant) {
    const L = LAYOUT[variant](item.pages, item.seed);
    const el = document.createElement("div");
    el.className = "cell stack";
    const height = L.ch + INS * 2;
    const contact = document.createElement("div");
    contact.className = "contact";
    contact.style.cssText = "left:" + (INS + 8) + "px;width:" + (FW - 16) + "px;top:" + (INS + L.ch - 9) + "px;" +
      "background:rgba(var(--contact)," + (0.2 + L.depth * 0.05).toFixed(2) + ");filter:blur(" + (4 + L.depth) + "px)";
    el.appendChild(contact);
    const layerEls = L.layers.map((ly) => {
      const d = document.createElement("div");
      d.className = "layer";
      d.style.cssText = "left:" + ly.left.toFixed(1) + "px;top:" + ly.top.toFixed(1) + "px;width:" + ly.w + "px;height:" + ly.h + "px;" +
        "background-image:" + ly.bg + ";filter:" + ly.filter + ";transform-origin:" + ly.origin + ";transform:" + tf(ly.rest);
      el.appendChild(d);
      return d;
    });
    const cover = document.createElement("div");
    cover.className = "cover";
    cover.style.cssText = "left:" + INS + "px;top:" + INS + "px;width:" + FW + "px;height:" + L.ch + "px;background-image:" + item.pages[0].bg + ";" +
      "--lift:" + (2 + L.depth) + "px;--spread:" + (4 + L.depth * 2) + "px;transform:rotate(" + L.coverRest.toFixed(2) + "deg)";
    const count = document.createElement("button");
    count.type = "button";
    count.className = "count";
    count.setAttribute("aria-label", item.pages.length + " 张");
    count.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="1.4" y="3.2" width="6" height="7.4" rx="0.8" transform="rotate(-10 4.4 6.9)"></rect><rect x="4" y="1.4" width="6" height="7.4" rx="0.8" fill="currentColor" fill-opacity="0" transform="rotate(8 7 5.1)"></rect></svg>' + item.pages.length;
    cover.appendChild(count);
    el.appendChild(cover);
    const angles = document.createElement("div");
    angles.className = "angles";
    angles.hidden = !showAngles;
    angles.textContent = L.layers.slice().reverse().map((ly) => signed(ly.rest.r)).join("  ");
    el.appendChild(angles);

    const set = (hot) => {
      el.classList.toggle("hot", hot);
      L.layers.forEach((ly, i) => { layerEls[i].style.transform = tf(hot ? ly.hot : ly.rest); });
      cover.style.transform = hot ? "translateY(-3px)" : "rotate(" + L.coverRest.toFixed(2) + "deg)";
      el.style.zIndex = hot ? "5" : "1";
    };
    el._set = set;
    let timer = 0;
    el.addEventListener("pointerenter", () => { if (lifted) return; clearTimeout(timer); timer = setTimeout(() => set(true), 120); });
    el.addEventListener("pointerleave", () => { clearTimeout(timer); if (!lifted) set(false); });
    return { el, height };
  }

  function render() {
    const list = items();
    const cols = document.getElementById("cols");
    cols.textContent = "";
    for (const v of VARIANTS) {
      const col = document.createElement("section");
      col.className = "col";
      col.innerHTML = "<h2></h2><p></p>";
      col.querySelector("h2").textContent = v.name;
      col.querySelector("p").textContent = v.note;
      const wall = document.createElement("div");
      wall.className = "wall";
      wall.style.width = (PAD * 2 + CELL * LANES + GAP * (LANES - 1)) + "px";
      wall.style.maxWidth = "100%";
      const hs = new Array(LANES).fill(PAD);
      for (const it of list) {
        let el, h;
        if (it.kind === "single") {
          el = document.createElement("div");
          el.className = "cell single";
          h = Math.round(CELL * it.ratio);
          el.style.backgroundImage = it.bg;
        } else {
          ({ el, height: h } = stackEl(it, v.id));
          if (lifted) el._set(true);
        }
        const lane = hs[0] <= hs[1] ? 0 : 1;
        el.style.left = (PAD + lane * (CELL + GAP)) + "px";
        el.style.top = hs[lane] + "px";
        el.style.width = CELL + "px";
        el.style.height = h + "px";
        hs[lane] += h + GAP;
        wall.appendChild(el);
      }
      wall.style.height = (Math.max(...hs) - GAP + PAD) + "px";
      col.appendChild(wall);
      cols.appendChild(col);
    }
    document.getElementById("batch").textContent = "第 " + (salt + 1) + " 批";
  }

  document.getElementById("reroll").addEventListener("click", () => { salt++; render(); });
  document.getElementById("lift").addEventListener("click", (e) => {
    lifted = !lifted;
    e.currentTarget.setAttribute("aria-pressed", String(lifted));
    document.querySelectorAll(".stack").forEach((s) => s._set(lifted));
  });
  document.getElementById("angles").addEventListener("click", (e) => {
    showAngles = !showAngles;
    e.currentTarget.setAttribute("aria-pressed", String(showAngles));
    document.querySelectorAll(".angles").forEach((a) => { a.hidden = !showAngles; });
  });
  render();
})();
</script>
