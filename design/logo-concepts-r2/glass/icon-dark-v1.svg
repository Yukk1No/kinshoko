<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
 <linearGradient id="bgdark" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#3E3968"/><stop offset="1" stop-color="#16142A"/></linearGradient>
 <radialGradient id="gldark" cx="0.5" cy="0.38" r="0.6"><stop offset="0" stop-color="#5A538E" stop-opacity="0.55"/><stop offset="1" stop-color="#5A538E" stop-opacity="0"/></radialGradient>
 <linearGradient id="stdark" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#FFE29A"/><stop offset="1" stop-color="#D99A2B"/></linearGradient>
 <linearGradient id="frdark" x1="0.1" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#E9E4FF" stop-opacity="0.26"/><stop offset="1" stop-color="#E9E4FF" stop-opacity="0.07"/></linearGradient>
 <linearGradient id="rimdark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.75"/><stop offset="0.35" stop-color="#fff" stop-opacity="0.08"/><stop offset="0.7" stop-color="#fff" stop-opacity="0.05"/><stop offset="1" stop-color="#fff" stop-opacity="0.44999999999999996"/></linearGradient>
 <radialGradient id="specdark" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <clipPath id="tcdark"><rect width="1024" height="1024" rx="228"/></clipPath>
 <clipPath id="bcdark"><path d="M82 20 H174 A18 18 0 0 1 192 38 V236 L128 192 L64 236 V38 A18 18 0 0 1 82 20 Z M116 117.8 A26 26 0 1 1 140 117.8 L147 158 H109 Z" clip-rule="evenodd" transform="translate(132.7 132.7) scale(2.963)"/></clipPath>
 <filter id="blurdark" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="26"/></filter>
 <filter id="shdark" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
 <filter id="glowdark" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<g clip-path="url(#tcdark)">
 <rect width="1024" height="1024" rx="228" fill="url(#bgdark)"/><rect width="1024" height="1024" rx="228" fill="url(#gldark)"/>
 <!-- back layer: sparkle with soft glow -->
 <path d="M512 183.33210000000003 C548.8 376.5321 548.8 376.5321 742 413.3321 C548.8 450.13210000000004 548.8 450.13210000000004 512 643.3321000000001 C475.2 450.13210000000004 475.2 450.13210000000004 282 413.3321 C475.2 376.5321 475.2 376.5321 512 183.33210000000003 Z" fill="url(#stdark)" opacity="0.55" filter="url(#glowdark)"/>
 <path d="M512 183.33210000000003 C548.8 376.5321 548.8 376.5321 742 413.3321 C548.8 450.13210000000004 548.8 450.13210000000004 512 643.3321000000001 C475.2 450.13210000000004 475.2 450.13210000000004 282 413.3321 C475.2 376.5321 475.2 376.5321 512 183.33210000000003 Z" fill="url(#stdark)"/>
 <!-- glass shadow -->
 <g opacity="0.45" filter="url(#shdark)" transform="translate(0 26)"><path d="M82 20 H174 A18 18 0 0 1 192 38 V236 L128 192 L64 236 V38 A18 18 0 0 1 82 20 Z M116 117.8 A26 26 0 1 1 140 117.8 L147 158 H109 Z" fill-rule="evenodd" transform="translate(132.7 132.7) scale(2.963)" fill="#000000"/></g>
 <!-- glass body: re-draw backdrop blurred inside the bookmark, then frost -->
 <g clip-path="url(#bcdark)">
  <rect width="1024" height="1024" rx="228" fill="url(#bgdark)"/><rect width="1024" height="1024" rx="228" fill="url(#gldark)"/>
  <path d="M512 183.33210000000003 C548.8 376.5321 548.8 376.5321 742 413.3321 C548.8 450.13210000000004 548.8 450.13210000000004 512 643.3321000000001 C475.2 450.13210000000004 475.2 450.13210000000004 282 413.3321 C475.2 376.5321 475.2 376.5321 512 183.33210000000003 Z" fill="url(#stdark)" filter="url(#blurdark)" transform="translate(0 10)"/>
  <rect width="1024" height="1024" fill="url(#frdark)"/>
  <ellipse cx="300" cy="250" rx="150" ry="70" fill="url(#specdark)" opacity="0.55" transform="rotate(-32 300 250)"/>
 </g>
 <!-- rim light -->
 <path d="M82 20 H174 A18 18 0 0 1 192 38 V236 L128 192 L64 236 V38 A18 18 0 0 1 82 20 Z M116 117.8 A26 26 0 1 1 140 117.8 L147 158 H109 Z" fill="none" stroke="url(#rimdark)" stroke-width="2.36" stroke-linejoin="round" transform="translate(132.7 132.7) scale(2.963)"/>
 <!-- tile edge highlight -->
 <rect x="3" y="3" width="1018" height="1018" rx="225" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="4"/>
</g>
