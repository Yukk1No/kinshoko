<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
 <linearGradient id="bglight" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#FFF8F2"/><stop offset="1" stop-color="#EFD6DD"/></linearGradient>
 <radialGradient id="gllight" cx="0.5" cy="0.38" r="0.6"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
 <linearGradient id="stlight" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#F7A3B6"/><stop offset="1" stop-color="#D9587A"/></linearGradient>
 <linearGradient id="frlight" x1="0.1" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.16"/></linearGradient>
 <linearGradient id="rimlight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="1.0"/><stop offset="0.35" stop-color="#fff" stop-opacity="0.08"/><stop offset="0.7" stop-color="#fff" stop-opacity="0.05"/><stop offset="1" stop-color="#fff" stop-opacity="0.6"/></linearGradient>
 <radialGradient id="speclight" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <clipPath id="tclight"><rect width="1024" height="1024" rx="228"/></clipPath>
 <clipPath id="bclight"><path d="M82 20 H174 A18 18 0 0 1 192 38 V236 L128 192 L64 236 V38 A18 18 0 0 1 82 20 Z M116 117.8 A26 26 0 1 1 140 117.8 L147 158 H109 Z" clip-rule="evenodd" transform="translate(132.7 132.7) scale(2.963)"/></clipPath>
 <filter id="blurlight" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="26"/></filter>
 <filter id="shlight" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
 <filter id="glowlight" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<g clip-path="url(#tclight)">
 <rect width="1024" height="1024" rx="228" fill="url(#bglight)"/><rect width="1024" height="1024" rx="228" fill="url(#gllight)"/>
 <!-- back layer: sparkle with soft glow -->
 <path d="M512 170 C602.0 380.0 602.0 380.0 812 470 C602.0 560.0 602.0 560.0 512 770 C422.0 560.0 422.0 560.0 212 470 C422.0 380.0 422.0 380.0 512 170 Z M630 470 A118 118 0 1 1 394 470 A118 118 0 1 1 630 470 Z" fill="url(#stlight)" opacity="0.55" filter="url(#glowlight)"/>
 <path d="M512 170 C602.0 380.0 602.0 380.0 812 470 C602.0 560.0 602.0 560.0 512 770 C422.0 560.0 422.0 560.0 212 470 C422.0 380.0 422.0 380.0 512 170 Z M630 470 A118 118 0 1 1 394 470 A118 118 0 1 1 630 470 Z" fill="url(#stlight)"/>
 <!-- glass shadow -->
 <g opacity="0.28" filter="url(#shlight)" transform="translate(0 26)"><path d="M82 20 H174 A18 18 0 0 1 192 38 V236 L128 192 L64 236 V38 A18 18 0 0 1 82 20 Z M116 117.8 A26 26 0 1 1 140 117.8 L147 158 H109 Z" fill-rule="evenodd" transform="translate(132.7 132.7) scale(2.963)" fill="#7A3A52"/></g>
 <!-- glass body: re-draw backdrop blurred inside the bookmark, then frost -->
 <g clip-path="url(#bclight)">
  <rect width="1024" height="1024" rx="228" fill="url(#bglight)"/><rect width="1024" height="1024" rx="228" fill="url(#gllight)"/>
  <path d="M512 170 C602.0 380.0 602.0 380.0 812 470 C602.0 560.0 602.0 560.0 512 770 C422.0 560.0 422.0 560.0 212 470 C422.0 380.0 422.0 380.0 512 170 Z M630 470 A118 118 0 1 1 394 470 A118 118 0 1 1 630 470 Z" fill="url(#stlight)" filter="url(#blurlight)" transform="translate(0 10)"/>
  <rect width="1024" height="1024" fill="url(#frlight)"/>
  <ellipse cx="300" cy="250" rx="150" ry="70" fill="url(#speclight)" opacity="0.55" transform="rotate(-32 300 250)"/>
 </g>
 <!-- rim light -->
 <path d="M82 20 H174 A18 18 0 0 1 192 38 V236 L128 192 L64 236 V38 A18 18 0 0 1 82 20 Z M116 117.8 A26 26 0 1 1 140 117.8 L147 158 H109 Z" fill="none" stroke="url(#rimlight)" stroke-width="2.36" stroke-linejoin="round" transform="translate(132.7 132.7) scale(2.963)"/>
 <!-- tile edge highlight -->
 <rect x="3" y="3" width="1018" height="1018" rx="225" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="4"/>
</g>
</svg>