<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
 <linearGradient id="daybg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#FFFDF8"/><stop offset="1" stop-color="#ECE5F3"/></linearGradient>
 <radialGradient id="daygl" cx="0.5" cy="0.42" r="0.55"><stop offset="0" stop-color="#F6C9D5" stop-opacity="0.55"/><stop offset="1" stop-color="#F6C9D5" stop-opacity="0"/></radialGradient>
 <linearGradient id="daybody" x1="0.15" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#5C5492"/><stop offset="1" stop-color="#2B2747"/></linearGradient>
 <linearGradient id="dayrim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.75"/><stop offset="0.45" stop-color="#fff" stop-opacity="0.08"/><stop offset="1" stop-color="#fff" stop-opacity="0.44999999999999996"/></linearGradient>
 <linearGradient id="dayspec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <linearGradient id="dayst" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB7C7"/><stop offset="1" stop-color="#E0768F"/></linearGradient>
 <linearGradient id="daykh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.1"/></linearGradient>
 <clipPath id="daybmc"><path d="M82 20 H174 A18 18 0 0 1 192 38 V236 L128 192 L64 236 V38 A18 18 0 0 1 82 20 Z M116 117.8 A26 26 0 1 1 140 117.8 L147 158 H109 Z" clip-rule="evenodd"/></clipPath>
 <clipPath id="daykhc"><path d="M116 117.8 A26 26 0 1 1 140 117.8 L147 158 H109 Z"/></clipPath>
 <clipPath id="daystc"><path d="M194 6 C200.4 39.6 200.4 39.6 234 46 C200.4 52.4 200.4 52.4 194 86 C187.6 52.4 187.6 52.4 154 46 C187.6 39.6 187.6 39.6 194 6 Z"/></clipPath>
 <clipPath id="daytile"><rect width="1024" height="1024" rx="228"/></clipPath>
 <filter id="dayblur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
 <filter id="dayblur2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<g clip-path="url(#daytile)">
 <rect width="1024" height="1024" fill="url(#daybg)"/>
 <rect width="1024" height="1024" fill="url(#daygl)"/>
 <path d="M0 0 H1024 V300 C700 380 320 260 0 360 Z" fill="#fff" opacity="0.05"/>
 <g transform="translate(160.0 154.0) scale(2.75)">
  <!-- cast shadow -->
  <path d="M82 20 H174 A18 18 0 0 1 192 38 V236 L128 192 L64 236 V38 A18 18 0 0 1 82 20 Z" transform="translate(4 14)" fill="#4B3F6B" opacity="0.45" filter="url(#dayblur)"/>
  <!-- glass body -->
  <path d="M82 20 H174 A18 18 0 0 1 192 38 V236 L128 192 L64 236 V38 A18 18 0 0 1 82 20 Z M116 117.8 A26 26 0 1 1 140 117.8 L147 158 H109 Z" fill-rule="evenodd" fill="url(#daybody)" opacity="0.88"/>
  <!-- keyhole depth -->
  <g clip-path="url(#daykhc)"><path d="M116 117.8 A26 26 0 1 1 140 117.8 L147 158 H109 Z" fill="url(#daykh)"/>
   <path d="M116 117.8 A26 26 0 1 1 140 117.8 L147 158 H109 Z" fill="none" stroke="#4B3F6B" stroke-opacity="0.5" stroke-width="6" transform="translate(0 2)" filter="url(#dayblur2)"/></g>
  <!-- inner rim light + specular -->
  <g clip-path="url(#daybmc)">
   <path d="M82 20 H174 A18 18 0 0 1 192 38 V236 L128 192 L64 236 V38 A18 18 0 0 1 82 20 Z M116 117.8 A26 26 0 1 1 140 117.8 L147 158 H109 Z" fill="none" stroke="url(#dayrim)" stroke-width="3.64"/>
   <path d="M60 14 H200 V70 C160 92 104 96 60 86 Z" fill="url(#dayspec)" opacity="0.7"/>
   <path d="M70 230 L128 188 L186 230" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="5"/>
  </g>
  <!-- sparkle: second glass layer overlapping the corner -->
  <path d="M194 6 C200.4 39.6 200.4 39.6 234 46 C200.4 52.4 200.4 52.4 194 86 C187.6 52.4 187.6 52.4 154 46 C187.6 39.6 187.6 39.6 194 6 Z" transform="translate(2 8)" fill="#4B3F6B" opacity="0.35" filter="url(#dayblur2)"/>
  <path d="M194 6 C200.4 39.6 200.4 39.6 234 46 C200.4 52.4 200.4 52.4 194 86 C187.6 52.4 187.6 52.4 154 46 C187.6 39.6 187.6 39.6 194 6 Z" fill="url(#dayst)" opacity="0.92"/>
  <g clip-path="url(#daystc)"><path d="M194 6 C200.4 39.6 200.4 39.6 234 46 C200.4 52.4 200.4 52.4 194 86 C187.6 52.4 187.6 52.4 154 46 C187.6 39.6 187.6 39.6 194 6 Z" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="3"/>
   <circle cx="186" cy="34" r="10" fill="#fff" opacity="0.55" filter="url(#dayblur2)"/></g>
 </g>
 <!-- tile edge light -->
 <rect x="3" y="3" width="1018" height="1018" rx="225" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="6"/>
</g>
</svg>