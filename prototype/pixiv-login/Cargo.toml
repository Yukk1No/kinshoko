[package]
name = "pixiv-login-proto"
version = "0.0.0"
edition = "2024"
publish = false

# #367 一次性原型：不进工作区，不合进 main。
[workspace]

[dependencies]
tao = "0.37"
wry = "0.57"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
sha2 = "0.10"
