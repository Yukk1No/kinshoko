<!doctype html>
<!--
  PROTOTYPE — 丢弃式原型，不是产品代码（#172）。
  问题：没有图库时打开程序，主窗口该长什么样？
  ?variant=0|A|B|C 切换（0 = 现状复刻），底部浮条或键盘 ← → 切换；T 或浮条按钮切换日夜。
  令牌、图标轨、书签标、封印书、窗口控件取自 accept/157-162-local 的 src/styles.css、src/ui/ui.css、
  src/shell/main-window.css、src/shell/Rail.tsx、src/shell/sealbook.ts（封印书为 sealBookSVG(0) 原样输出）。
  只放正式程序已有的功能：新建图库（名称 + 存放位置）、打开图库、Eagle 迁入走“导入”、截图钉图不需要图库。
  所有按钮都是假的：选择位置填入示例路径，建立 / 打开只弹一条说明。直接双击打开即可，不需要构建。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空图库向导原型</title>
<style>
:root {
  --font: "Kinshoko Inter", "Inter", "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
  --bg: #F7F3EA; --rail: #EFE8DA; --surface: #FFFDF8; --surface-2: #F1EBDF; --sunken: #EDE7DA;
  --hover: rgba(43, 39, 71, 0.07); --press: rgba(43, 39, 71, 0.12);
  --ink: #2B2747; --ink-2: #5B5773; --ink-3: #8C88A0; --line: #E3DACA; --line-2: #D4C9B5;
  --accent: #E0768F; --accent-strong: #B5465F; --accent-soft: rgba(224, 118, 143, 0.14);
  --wall: #EAE9E6; --card: #DCDBD8; --danger: #B23A3A;
  --shadow: 0 1px 2px rgba(43, 39, 71, 0.08), 0 8px 24px rgba(43, 39, 71, 0.12);
  --shadow-pop: 0 0 0 1px rgba(43, 39, 71, 0.06), 0 2px 4px rgba(43, 39, 71, 0.06), 0 12px 32px rgba(43, 39, 71, 0.14);
  --r-xs: 6px; --r-s: 8px; --r: 10px; --r-m: 12px; --r-l: 14px; --r-xl: 18px;
  --spring: cubic-bezier(0.2, 0.9, 0.25, 1.05); --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --t-fast: 120ms; --t: 200ms; --t-slow: 260ms;
  --win-close: #C94A4A; --on-win-close: #FFFDF8;
  --seal-acc: #C85672; --seal-ink: var(--ink);
  /* 现状（.v0）用的旧令牌 */
  --old-line: rgb(43 39 71 / 0.14);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #1E1C2C; --rail: #17151F; --surface: #252336; --surface-2: #2C2940; --sunken: #19172A;
  --hover: rgba(244, 236, 220, 0.07); --press: rgba(244, 236, 220, 0.12);
  --ink: #F4ECDC; --ink-2: #C8C0B2; --ink-3: #8F889E; --line: #353249; --line-2: #45415C;
  --accent: #E3B34F; --accent-strong: #E9C26E; --accent-soft: rgba(227, 179, 79, 0.16);
  --wall: #161618; --card: #222224; --danger: #F08A8A;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px rgba(0, 0, 0, 0.45);
  --shadow-pop: 0 0 0 1px rgba(244, 236, 220, 0.08), 0 12px 32px rgba(0, 0, 0, 0.45);
  --seal-acc: #E3B34F; --old-line: rgb(244 236 220 / 0.14);
  color-scheme: dark;
}
@media (prefers-reduced-motion: reduce) { :root { --t-fast: 0ms; --t: 0ms; --t-slow: 0ms; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: default; }
h1, h2, h3 { font-weight: 600; margin: 0; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }

/* ---- 外壳：图标轨（Rail.tsx 原样） ---- */
.app { display: flex; height: 100vh; }
.rail { width: 56px; flex: none; background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 6px 0 10px; z-index: 3; }
.brand { height: 44px; display: grid; place-items: center; margin-bottom: 8px; }
.brand-mark { fill: var(--ink); }
.rail-items { position: relative; display: flex; flex-direction: column; gap: 4px; width: 100%; align-items: center; }
.rail-indicator { position: absolute; left: 0; top: 8px; height: 24px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.rail-btn { position: relative; width: 40px; height: 40px; border: 0; border-radius: 10px; display: grid; place-items: center; background: transparent; color: var(--ink-2); padding: 0; }
.rail-btn svg.i { width: 20px; height: 20px; }
.rail-btn:hover { background: var(--hover); color: var(--ink); }
.rail-btn.is-active { color: var(--ink); background: var(--accent-soft); }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; align-items: center; }
.seal-book { --seal-cut: color-mix(in srgb, var(--seal-acc) 14%, var(--rail)); background: var(--seal-cut); }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }

/* ---- 顶栏与窗口控件（ui.css） ---- */
.topbar { height: 56px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 16px; }
.k-grow { flex: 1; }
.win { display: flex; align-items: center; gap: 2px; margin-left: auto; flex: none; }
.win-div { width: 1px; height: 22px; background: var(--line); margin: 0 4px 0 2px; }
.win-btn { width: 38px; height: 26px; border: 0; border-radius: 7px; background: transparent; color: var(--ink-2); display: grid; place-items: center; padding: 0; }
.win-btn:hover { background: var(--hover); color: var(--ink); }
.win-btn.is-close:hover { background: var(--win-close); color: var(--on-win-close); }
.win-btn svg { width: 10px; height: 10px; stroke: currentColor; stroke-width: 1; fill: none; shape-rendering: crispEdges; }

/* ---- 共用控件（ui.css 的 k-btn 等） ---- */
.k-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border: 0; border-radius: 9px; font-weight: 500; white-space: nowrap;
  color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); transition: background var(--t-fast), transform var(--t-fast) var(--spring); }
.k-btn:hover:not(:disabled) { background: var(--surface-2); }
.k-btn:active:not(:disabled) { transform: scale(0.97); }
.k-btn:disabled { opacity: 0.45; }
.k-btn.is-primary { background: var(--ink); color: var(--bg); box-shadow: none; }
.k-btn.is-primary:hover:not(:disabled) { background: color-mix(in srgb, var(--ink) 88%, var(--bg)); }
.k-btn.is-ghost { background: transparent; box-shadow: none; color: var(--accent-strong); }
.k-btn.is-ghost:hover:not(:disabled) { background: var(--accent-soft); }
.k-btn.is-lg { height: 40px; padding: 0 18px; border-radius: 11px; }
.k-btn:focus-visible, .k-input:focus-visible, .choice:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.k-field { display: flex; flex-direction: column; gap: 6px; }
.k-label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.k-input { height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); outline: 0; width: 100%; }
.k-input:focus { box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 0 4px var(--accent-soft); }
.k-path { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px 0 12px; border-radius: 10px; background: var(--sunken); color: var(--ink-3); min-width: 0; }
.k-path.is-set { color: var(--ink); }
.k-path .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.k-path .k-btn { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
.hint { font-size: 12px; color: var(--ink-3); }
.hint b { color: var(--ink-2); font-weight: 500; }
.tip-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); }
.tip-row svg.i { width: 14px; height: 14px; }
.k-sep { height: 1px; background: var(--line); }

/* ================= 0：现状（App.tsx + CreateLibrary.tsx + 旧 styles.css） ================= */
.v0-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; }
.v0 .create-library { display: flex; flex-direction: column; gap: 12px; width: min(440px, calc(100% - 32px)); }
.v0 h1 { font-size: 16px; }
.v0 p { margin: 0; opacity: .8; }
.v0 label { display: flex; flex-direction: column; gap: 4px; }
.v0 input { padding: 4px 8px; border: 1px solid var(--old-line); border-radius: 6px; background: transparent; }
.v0 .loc { display: flex; align-items: center; gap: 8px; }
.v0 .old-btn { padding: 4px 12px; border: 1px solid var(--old-line); border-radius: 6px; background: transparent; }
.v0 .old-btn.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; align-self: flex-start; }
.v0 .old-btn:disabled { opacity: .5; }
.v0 .path { opacity: .8; }

/* ================= A：居中引导卡（先选，再填） ================= */
.vA-body { flex: 1; display: grid; place-items: center; padding: 24px 24px 80px; }
.vA-card { width: 460px; display: flex; flex-direction: column; }
.vA-head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; margin-bottom: 28px; }
.vA-head svg { width: 48px; height: 48px; }
.vA-head h1 { font-size: 22px; letter-spacing: 0.01em; }
.vA-head p { margin: 0; color: var(--ink-2); }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; border: 0; border-radius: var(--r-l); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);
  text-align: left; transition: background var(--t-fast), box-shadow var(--t-fast), transform var(--t-fast) var(--spring); }
.choice:hover { box-shadow: inset 0 0 0 1px var(--line-2), var(--shadow); }
.choice:active { transform: scale(0.99); }
.choice .tile { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); flex: none; }
.choice.is-main .tile { background: var(--ink); color: var(--bg); }
.choice .tile svg.i { width: 20px; height: 20px; }
.choice .t { flex: 1; min-width: 0; }
.choice .t b { display: block; font-weight: 600; }
.choice .t span { display: block; color: var(--ink-3); font-size: 12px; }
.choice .chev { color: var(--ink-3); }
.vA-foot { margin-top: 22px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.vA-form { display: flex; flex-direction: column; gap: 16px; padding: 20px; border-radius: var(--r-xl); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.vA-form .row-end { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.back { align-self: flex-start; margin: -6px 0 2px -8px; height: 28px; padding: 0 8px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
.back:hover { background: var(--hover); color: var(--ink); }
.fade-in { animation: fade var(--t) var(--spring); }
@keyframes fade { from { opacity: 0; transform: translateY(4px) scale(0.99); } }

/* ================= B：分屏（左：将来的图片墙；右：设置面板） ================= */
.vB { display: flex; flex: 1; min-height: 0; }
.vB-wall { flex: 1; min-width: 0; background: var(--wall); position: relative; overflow: hidden; display: flex; flex-direction: column; }
.vB-wall .topbar { position: relative; z-index: 2; }
.ghost { position: absolute; inset: 56px 0 0; padding: 8px 16px; columns: 5 160px; column-gap: 10px; opacity: .45;
  -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 45%, transparent 0 35%, #000 95%); mask-image: radial-gradient(ellipse 70% 70% at 50% 45%, transparent 0 35%, #000 95%); }
.ghost i { display: block; break-inside: avoid; margin-bottom: 10px; border-radius: 6px; background: var(--card); }
.vB-caption { position: relative; z-index: 2; margin: auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 56px; }
.vB-caption svg { width: 40px; height: 40px; }
.vB-caption h1 { font-size: 20px; }
.vB-caption p { margin: 0; color: var(--ink-2); }
.vB-side { width: 400px; flex: none; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.vB-side .topbar { padding-left: 20px; }
.vB-side .pane-title { font-size: 15px; font-weight: 600; }
.vB-inner { flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 8px 24px 24px; overflow: auto; }
.seg { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 11px; background: var(--sunken); position: relative; }
.seg button { position: relative; z-index: 1; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.seg button[aria-pressed="true"] { color: var(--ink); }
.seg .pill { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 8px; background: var(--surface); box-shadow: 0 1px 2px rgba(43,39,71,.12), 0 0 0 1px var(--line); transition: transform 300ms var(--spring); }
.seg[data-on="open"] .pill { transform: translateX(100%); }
.vB-desc { margin: -6px 0 0; color: var(--ink-3); font-size: 12px; }
.vB-fill { flex: 1; }
.vB-facts { display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line); }

/* ================= C：就地步骤（正式外壳 + 三步清单） ================= */
.vC { display: flex; flex: 1; min-height: 0; }
.vC-side { width: 256px; flex: none; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.pane-head { height: 56px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 10px 0 16px; }
.pane-head .pane-title { flex: 1; font-size: 15px; font-weight: 600; }
.k-icon-btn { width: 28px; height: 28px; border: 0; border-radius: 8px; display: grid; place-items: center; background: transparent; color: var(--ink-2); padding: 0; }
.k-icon-btn:hover { background: var(--hover); color: var(--ink); }
.k-icon-btn.is-cue { background: var(--accent-soft); color: var(--accent-strong); }
.side-empty { margin: 4px 8px; padding: 12px; border-radius: 10px; border: 1px dashed var(--line-2); color: var(--ink-3); font-size: 12px; line-height: 18px; }
.side-rows { padding: 0 8px; display: flex; flex-direction: column; }
.k-row { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 8px; color: var(--ink-3); font-size: 13px; }
.k-row .n { margin-left: auto; font-size: 12px; }
.vC-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.search { flex: 1; max-width: 960px; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-3); opacity: .6; }
.split { display: inline-flex; height: 36px; border-radius: 11px; background: var(--ink); color: var(--bg); opacity: .35; }
.split span { display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; font-weight: 500; }
.split span + span { width: 32px; padding: 0; justify-content: center; border-left: 1px solid color-mix(in srgb, var(--bg) 25%, transparent); }
.vC-wall { flex: 1; min-height: 0; background: var(--wall); display: grid; place-items: center; padding: 24px; overflow: auto; }
.steps { width: 560px; background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--shadow); padding: 8px; }
.steps-head { padding: 16px 16px 12px; }
.steps-head h1 { font-size: 18px; }
.steps-head p { margin: 2px 0 0; color: var(--ink-3); font-size: 13px; }
.step { display: grid; grid-template-columns: 28px 1fr; gap: 0 14px; padding: 14px 16px; border-radius: var(--r-l); }
.step.is-now { background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); }
.num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line-2); }
.step.is-now .num { background: var(--ink); color: var(--bg); box-shadow: none; }
.step h2 { font-size: 14px; line-height: 28px; }
.step:not(.is-now) h2 { color: var(--ink-2); font-weight: 500; }
.step .d { grid-column: 2; color: var(--ink-3); font-size: 12px; margin-top: -2px; }
.step .body { grid-column: 2; display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.inline-row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
.step .acts { display: flex; align-items: center; gap: 8px; }

/* ---- 假操作的说明 ---- */
.toast { position: fixed; right: 20px; bottom: 76px; z-index: 40; max-width: 340px; padding: 10px 14px; border-radius: var(--r-m); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-pop); font-size: 13px;
  opacity: 0; transform: translateY(6px); transition: opacity 150ms, transform 220ms var(--spring); pointer-events: none; }
.toast.is-on { opacity: 1; transform: none; }

/* ---- 原型切换条（不属于被评估的设计） ---- */
.proto-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: #111; color: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.35); font: 12px system-ui, sans-serif; }
.proto-bar button { height: 30px; min-width: 30px; padding: 0 10px; border: 0; border-radius: 999px; background: none; color: inherit; font: inherit; cursor: pointer; }
.proto-bar button:hover { background: rgba(255,255,255,.12); }
.proto-bar .label { padding: 0 10px; min-width: 230px; text-align: center; }
.proto-bar .sep { width: 1px; height: 18px; background: rgba(255,255,255,.25); margin: 0 4px; }
.proto-bar .state { padding: 0 10px; opacity: .7; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="主导航">
    <div class="brand" title="Kinshoko"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path class="brand-mark" fill-rule="evenodd" d="M12 6 H20 A2 2 0 0 1 22 8 V27 L16 22.5 L10 27 V8 A2 2 0 0 1 12 6 Z M14.8 15.75 A3 3 0 1 1 17.2 15.75 L18 19.5 H14 Z"/></svg></div>
    <div class="rail-items">
      <span class="rail-indicator" aria-hidden="true"></span>
      <button class="rail-btn is-active" aria-label="图片与文件夹" data-icon="images"></button>
      <button class="rail-btn" aria-label="参考组" data-icon="layers"></button>
      <button class="rail-btn" aria-label="截图历史" data-icon="history"></button>
    </div>
    <div class="rail-foot">
      <button class="rail-btn seal-book" aria-label="安全模式：开启"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" fill="var(--seal-ink)" opacity="1" d="M4 6 A4 4 0 0 1 8 2 H18.5 A1.5 1.5 0 0 1 20 3.5 V15.5 A1 1 0 0 1 19 16.5 H19 V19 H19 A1 1 0 0 1 19 21 H5.5 A1.5 1.5 0 0 1 4 19.5 Z M7 17 H16 A1 1 0 0 1 17 18 V18 A1 1 0 0 1 16 19 H7 A1 1 0 0 1 6 18 V18 A1 1 0 0 1 7 17 Z"/><path fill="var(--seal-ink)" d="M4 6 Q4 2 8 2 Q10.08 2 18.5 2 Q20 2 20 3.5 L20 15 Q20 16.5 18.5 16.5 Q10.08 16.5 8 16.5 Q4 16.5 4 12.5 Z"/><path fill="var(--seal-ink)" stroke="var(--seal-cut)" stroke-width="0" stroke-linejoin="round" paint-order="stroke" d="M4 6 Q4 2 8 2 Q10.08 2 18.5 2 Q20 2 20 3.5 L20 15 Q20 16.5 18.5 16.5 Q10.08 16.5 8 16.5 Q4 16.5 4 12.5 Z"/><g><path d="M10.5 9.6 V7 A1.5 1.5 0 0 1 13.5 7 V8.8" fill="none" stroke="var(--seal-cut)" stroke-width="3" stroke-linecap="round"/><path d="M8 11 A4 4 0 1 0 16 11 A4 4 0 1 0 8 11 Z" fill="var(--seal-cut)"/><path d="M10.5 9.6 V7 A1.5 1.5 0 0 1 13.5 7 V8.8" fill="none" stroke="var(--seal-acc)" stroke-width="1"/><path d="M9 11 A3 3 0 1 0 15 11 A3 3 0 1 0 9 11 Z M11.7 11.34 A0.8 0.8 0 1 1 12.3 11.34 L12.5 13.1 H11.5 Z" fill-rule="evenodd" fill="var(--seal-acc)"/></g></svg></button>
      <button class="rail-btn" aria-label="设置" data-icon="settings"></button>
    </div>
  </nav>
  <div class="col" id="stage"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="proto-bar" role="toolbar" aria-label="原型切换">
  <button id="prev" aria-label="上一个">‹</button>
  <span class="label" id="label"></span>
  <button id="next" aria-label="下一个">›</button>
  <span class="sep"></span>
  <span class="state" id="state"></span>
  <span class="sep"></span>
  <button id="theme">日 / 夜</button>
</div>
<script>
// ---- lucide 图标（与正式程序同一套，线宽 1.75） ----
const P = {
  images: '<path d="M18 22H4a2 2 0 0 1-2-2V6"/><path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18"/><circle cx="12" cy="8" r="2"/><rect width="16" height="16" x="6" y="2" rx="2"/>',
  layers: '<path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
  history: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
  settings: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  folderPlus: '<path d="M12 10v6"/><path d="M9 13h6"/><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  folderOpen: '<path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/>',
  chevR: '<path d="m9 18 6-6-6-6"/>', chevL: '<path d="m15 18-6-6 6-6"/>', chevD: '<path d="m6 9 6 6 6-6"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  import: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
  pin: '<path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>',
  bulb: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
};
const I = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
document.querySelectorAll('[data-icon]').forEach((b) => { b.innerHTML = I(b.dataset.icon); });
const MARK = (s) => `<svg viewBox="0 0 32 32" width="${s}" height="${s}" aria-hidden="true"><path class="brand-mark" fill-rule="evenodd" d="M12 6 H20 A2 2 0 0 1 22 8 V27 L16 22.5 L10 27 V8 A2 2 0 0 1 12 6 Z M14.8 15.75 A3 3 0 1 1 17.2 15.75 L18 19.5 H14 Z"/></svg>`;
const WIN = `<div class="win"><span class="win-div"></span>
  <button class="win-btn" aria-label="最小化"><svg viewBox="0 0 10 10"><path d="M0 5.5H10"/></svg></button>
  <button class="win-btn" aria-label="最大化"><svg viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9"/></svg></button>
  <button class="win-btn is-close" aria-label="关闭"><svg viewBox="0 0 10 10" style="shape-rendering:auto"><path d="M0 0L10 10M10 0L0 10"/></svg></button></div>`;

// ---- 原型状态（内存里，刷新即清空） ----
const S = { name: '我的参考', parent: null, mode: 'create', step: 'choose' };
const SAMPLE = 'D:\\绘画\\参考图';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('is-on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('is-on'), 2600); }
function stateLine() { document.getElementById('state').textContent = `名称“${S.name}” · 位置 ${S.parent ?? '未选'} · ${S.mode === 'create' ? '新建' : '打开'}${S.step === 'form' ? ' · 填写中' : ''}`; }

const pathBox = (btnLabel = '选择…') => `<div class="k-path${S.parent ? ' is-set' : ''}">${I('folderOpen')}<span class="txt" title="${esc(S.parent ?? '')}">${S.parent ? esc(S.parent + '\\' + (S.name.trim() || '…')) : '尚未选择'}</span><button class="k-btn" data-act="pick">${btnLabel}</button></div>`;
const nameField = (id) => `<label class="k-field"><span class="k-label">图库名称</span><input class="k-input" id="${id}" value="${esc(S.name)}" data-act="name"></label>`;
const locField = () => `<div class="k-field"><span class="k-label">存放位置</span>${pathBox()}</div>`;
const canCreate = () => S.parent && S.name.trim();
const tips = (items) => items.map(([icon, html]) => `<div class="tip-row">${I(icon)}<span>${html}</span></div>`).join('');
const TIP_EAGLE = ['bulb', '用过 Eagle？建好图库后从<b>导入</b>迁入'];
const TIP_PIN = ['pin', '截图和钉图不需要图库，随时可用'];
const TIP_SAFE = ['shield', '安全模式默认开启，成人图会被封印'];

// ---- 变体 ----
const V = {
  '0': { name: '现状', render: () => `<div class="v0" style="display:contents">
    <header class="topbar"><span class="k-grow"></span>${WIN}</header>
    <div class="v0-body">
      <section class="create-library"><h1>新建图库</h1><p>在所选位置新建同名文件夹存放图片。</p>
        <label>图库名称<input value="${esc(S.name)}" data-act="name"></label>
        <div class="loc"><button class="old-btn" data-act="pick">选择存放位置…</button><span class="path">${esc(S.parent ?? '尚未选择')}</span></div>
        <button class="old-btn primary" data-act="create" ${canCreate() ? '' : 'disabled'}>建立图库</button></section>
      <section><button class="k-btn" data-act="open">${I('folderOpen')}打开图库…</button></section>
    </div></div>` },

  A: { name: '居中引导', render: () => `
    <header class="topbar"><span class="k-grow"></span>${WIN}</header>
    <div class="vA-body"><div class="vA-card fade-in" key="${S.step}">
      ${S.step === 'choose' ? `
        <div class="vA-head">${MARK(48)}<h1>欢迎使用 Kinshoko</h1><p>先准备一个图库，用来存放参考图。</p></div>
        <div class="choices">
          <button class="choice is-main" data-act="toForm"><span class="tile">${I('folderPlus')}</span><span class="t"><b>新建图库</b><span>在你选的位置新建文件夹</span></span>${I('chevR', 'chev')}</button>
          <button class="choice" data-act="open"><span class="tile">${I('folderOpen')}</span><span class="t"><b>打开图库</b><span>选择已有图库所在的文件夹</span></span>${I('chevR', 'chev')}</button>
        </div>
        <div class="vA-foot">${tips([TIP_EAGLE, TIP_PIN])}</div>`
      : `
        <div class="vA-form">
          <button class="back" data-act="toChoose">${I('chevL')}返回</button>
          <div><h1 style="font-size:18px">新建图库</h1><p class="hint" style="margin:2px 0 0">图片会存进这个新文件夹</p></div>
          ${nameField('nameA')}
          ${locField()}
          <div class="row-end"><span class="k-grow"></span><button class="k-btn is-primary is-lg" data-act="create" ${canCreate() ? '' : 'disabled'}>建立图库</button></div>
        </div>
        <div class="vA-foot">${tips([TIP_EAGLE])}</div>`}
    </div></div>` },

  B: { name: '分屏面板', render: () => {
    const h = [120, 180, 90, 150, 210, 110, 160, 130, 200, 95, 170, 140, 115, 190, 125, 160, 100, 220, 135, 150, 105, 175, 145, 120, 185];
    return `<div class="vB">
      <section class="vB-wall"><header class="topbar"></header>
        <div class="ghost" aria-hidden="true">${h.map((x) => `<i style="height:${x}px"></i>`).join('')}</div>
        <div class="vB-caption">${MARK(40)}<h1>你的参考图会在这里</h1><p>先在右边准备一个图库</p></div>
      </section>
      <aside class="vB-side">
        <header class="topbar"><span class="pane-title">准备图库</span>${WIN}</header>
        <div class="vB-inner">
          <div class="seg" data-on="${S.mode}" role="group" aria-label="方式"><span class="pill"></span>
            <button data-act="modeCreate" aria-pressed="${S.mode === 'create'}">${I('folderPlus')}新建</button>
            <button data-act="modeOpen" aria-pressed="${S.mode === 'open'}">${I('folderOpen')}打开已有</button></div>
          ${S.mode === 'create' ? `
            <p class="vB-desc">在你选的位置新建文件夹存放图片</p>
            ${nameField('nameB')}
            ${locField()}
            <button class="k-btn is-primary is-lg" data-act="create" ${canCreate() ? '' : 'disabled'}>建立图库</button>`
          : `
            <p class="vB-desc">选择已有图库所在的文件夹</p>
            <div class="k-field"><span class="k-label">图库文件夹</span>${pathBox()}</div>
            <button class="k-btn is-primary is-lg" data-act="open" ${S.parent ? '' : 'disabled'}>打开图库</button>`}
          <div class="vB-fill"></div>
          <div class="vB-facts">${tips([TIP_EAGLE, TIP_PIN, TIP_SAFE])}</div>
        </div>
      </aside></div>`; } },

  C: { name: '就地步骤', render: () => `<div class="vC">
    <aside class="vC-side">
      <header class="pane-head"><span class="pane-title">图库</span><button class="k-icon-btn is-cue" aria-label="新建图库" title="新建图库" data-act="focusName">${I('plus')}</button></header>
      <div class="side-empty">还没有图库，建好后文件夹列在这里</div>
      <div class="k-sep" style="margin:10px 0 6px"></div>
      <div class="side-rows"><div class="k-row">${I('images')}全部图片<span class="n">0</span></div><div class="k-row">${I('trash')}回收站</div></div>
    </aside>
    <section class="vC-main">
      <header class="topbar"><div class="search">${I('search')}<span>建好图库后可以查找</span></div>
        <span class="split" aria-disabled="true"><span>${I('import')}导入</span><span>${I('chevD')}</span></span>${WIN}</header>
      <div class="vC-wall"><div class="steps">
        <div class="steps-head"><h1>三步开始</h1><p>第一步做完，其余的随时都能做</p></div>
        <div class="step is-now"><span class="num">1</span><h2>建一个图库</h2><span class="d">在你选的位置新建文件夹存放图片</span>
          <div class="body"><div class="inline-row">${nameField('nameC')}${locField()}</div>
            <div class="acts"><button class="k-btn is-primary" data-act="create" ${canCreate() ? '' : 'disabled'}>建立图库</button><button class="k-btn is-ghost" data-act="open">已有图库？打开它</button></div></div></div>
        <div class="step"><span class="num">2</span><h2>导入图片</h2><span class="d">文件、文件夹，或从 Eagle 迁入</span></div>
        <div class="step"><span class="num">3</span><h2>找图与参考</h2><span class="d">按标签查找，截图钉在画布旁</span></div>
      </div></div>
    </section></div>` },
};
const KEYS = Object.keys(V);

// ---- 渲染与交互 ----
const params = new URLSearchParams(location.search);
let cur = KEYS.includes(params.get('variant')) ? params.get('variant') : 'A';
if (params.get('step') === 'form') S.step = 'form';
if (params.get('mode') === 'open') S.mode = 'open';
if (params.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
const stage = document.getElementById('stage');
function render(keepFocus) {
  const focusId = keepFocus && document.activeElement?.id; const caret = document.activeElement?.selectionStart;
  stage.innerHTML = V[cur].render();
  document.getElementById('label').textContent = `${cur}（${V[cur].name}）  ${KEYS.indexOf(cur) + 1} / ${KEYS.length}`;
  stateLine();
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); el.setSelectionRange?.(caret, caret); } }
}
function go(d) {
  cur = KEYS[(KEYS.indexOf(cur) + d + KEYS.length) % KEYS.length];
  const u = new URL(location); u.searchParams.set('variant', cur); history.replaceState(null, '', u); render();
}
stage.addEventListener('input', (e) => { if (e.target.dataset.act === 'name') { S.name = e.target.value; render(true); } });
stage.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]')?.dataset.act; if (!a || a === 'name') return;
  if (a === 'pick') { S.parent = S.parent ? null : SAMPLE; toast(S.parent ? `（原型）已选择 ${SAMPLE}；再点一次清空` : '（原型）已清空位置'); }
  if (a === 'create') toast(`（原型）将新建 ${S.parent}\\${S.name.trim()} 并打开`);
  if (a === 'open') toast('（原型）会弹出系统的选择文件夹窗口');
  if (a === 'toForm') S.step = 'form';
  if (a === 'toChoose') S.step = 'choose';
  if (a === 'modeCreate') S.mode = 'create';
  if (a === 'modeOpen') S.mode = 'open';
  if (a === 'focusName') { document.getElementById('nameC')?.select(); return; }
  render();
});
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
const flipTheme = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; const u = new URL(location); u.searchParams.set('theme', r.dataset.theme); history.replaceState(null, '', u); };
document.getElementById('theme').onclick = flipTheme;
addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') go(-1); else if (e.key === 'ArrowRight') go(1); else if (e.key.toLowerCase() === 't') flipTheme();
});
render();
</script>
</body>
</html>
