[workspace]
resolver = "3"
members = ["crates/kinshoko-core", "src-tauri"]
# 探测工具与原型各自带 Cargo.lock，不并入工作区。
exclude = ["tools", "prototype"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
kinshoko-core = { path = "crates/kinshoko-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
